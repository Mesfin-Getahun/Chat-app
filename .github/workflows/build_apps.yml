name: Build Android APK and iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: .

      - name: Build APK
        run: flutter build apk --release
        working-directory: .

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Bondly-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App (.ipa / Runner)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: .

      - name: Build iOS (No codesign for direct export)
        run: flutter build ios --release --no-codesign
        working-directory: .

      - name: Package Payload as unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Bondly-iOS-unsigned.ipa Payload
        working-directory: .

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bondly-iOS-App
          path: Bondly-iOS-unsigned.ipa
